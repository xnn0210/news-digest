# 每日新闻 — 新闻源配置
#
# 只收录主流、免费、有官方 RSS 的新闻网站。
# 每篇文章有两个维度：栏目(内容类型，一篇一个)和地区(按国家/城市/人物识别，可以有两个)。
#
# 每个 feed 可以写:
#   url:      官方 RSS 地址
#   section:  这个 feed 属于哪个栏目(见 sections)；不写则按 classify 的关键词判断，判断不出归入 news(时政)
#   default:  内容比较杂的 feed：先按关键词判断栏目，判断不出再归入这个栏目
#   region:   标题和摘要里认不出地区时用的默认地区(见 regions)，例如英国本地新闻的 feed 写 europe
#   opinion:  true 表示评论文章，页面上会标"评论"
#   rank:     true 表示这是媒体的首页头条 feed(按编辑排序)，用来挑选"要闻"
#   lang:     覆盖来源的语言(en / zh)
#
# 来源可选项: t2s: true 把繁体字转成简体；exclude: [正则] 标题匹配则丢弃；keep_query: true 保留链接里的 ?参数

settings:
  max_age_hours: 48      # 只收录这么多小时以内发布的文章
  keep_days: 30          # 数据库与归档页面保留天数
  timezone: Europe/London  # 按哪个时区划分"每天"(云端服务器是 UTC，所以写明时区)；local = 电脑当前时区
  timeout: 20            # 单个 feed 超时(秒)
  workers: 12            # 并发抓取数

# 用 Claude 把英文新闻的标题和摘要翻译成中文(需要在 .env 里设置 ANTHROPIC_API_KEY)
# 每篇只翻译一次，结果存在数据库里；原文有改动时会重新翻译
translate:
  enabled: true
  model: claude-haiku-5-5   # 想要更好的译文可换成 claude-sonnet-5-5 或 claude-opus-5-5(贵 20–40 倍)
  batch_size: 30            # 每次请求翻译多少篇
  workers: 4                # 并发请求数
  max_per_run: 2000         # 每次运行最多翻译多少篇，防止意外花费

# 栏目：顶部导航，按这里的顺序显示
sections:
  news: 时政
  business: 财经
  tech: 科技
  science: 科学与健康
  culture: 文化
  sport: 体育

